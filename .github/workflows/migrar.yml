name: migrar
on:
  push:
    branches: [main]
    paths:
      - 'migrations/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          ls migrations/
          cat migrations/*.sql
          echo "Idempotente por IF NOT EXISTS"
          