name: ai-review
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Analisa diff
        id: check
        run: |
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD)
          echo "$DIFF" > diff.txt
          if echo "$DIFF" | grep -q "\${"; then
            echo "status=vulneravel" >> $GITHUB_OUTPUT
          else
            echo "status=seguro" >> $GITHUB_OUTPUT
          fi
      - id: ia
        uses: actions/ai-inference@v1
        continue-on-error: true
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        with:
          prompt: "Analise o arquivo diff.txt e reporte SQL Injection se houver concatenacao em env.DB.prepare"
      - name: Comenta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.check.outputs.status }}" = "vulneravel" ]; then
            MSG="IA Review (fallback): Detectado possivel SQL Injection com concatenacao em env.DB.prepare - use .prepare('... ?').bind(variavel) - IA principal falhou"
          else
            MSG="IA Review (fallback): Codigo seguro agora - uso correto de .prepare('... ?').bind(variavel) - vulnerabilidade corrigida!"
          fi
          if [ -f "${{ steps.ia.outputs.response-file }}" ]; then
            cat "${{ steps.ia.outputs.response-file }}" > final.txt
            echo "" >> final.txt
            echo "$MSG" >> final.txt
            gh pr comment ${{ github.event.pull_request.number }} --body-file final.txt
          else
            gh pr comment ${{ github.event.pull_request.number }} --body "$MSG: ${{ steps.ia.outputs.error }}"
          fi