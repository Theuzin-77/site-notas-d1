name: ai-review
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Monta prompt
        run: |
          echo "Voce e um revisor de seguranca. Analise este diff:" > prompt.txt
          echo "Regra critica: se encontrar env.DB.prepare com template string contendo \${ , ou concatenacao com + , e SQL INJECTION critico. APONTE!" >> prompt.txt
          echo "Codigo:" >> prompt.txt
          git diff origin/${{ github.base_ref }}...HEAD >> prompt.txt
          cat prompt.txt
      - id: ia
        uses: actions/ai-inference@v1
        continue-on-error: true
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        with:
          prompt-file: prompt.txt
          system-prompt: "Voce e auditor de SQL Injection. Se ver prepare com ${ } ou + , diga VULNERAVEL."
      - name: Comenta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "${{ steps.ia.outputs.response-file }}" ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body-file "${{ steps.ia.outputs.response-file }}"
          else
            gh pr comment ${{ github.event.pull_request.number }} --body "IA Review (fallback): Detectado possivel SQL Injection com concatenacao em env.DB.prepare - use .prepare('... ?').bind(variavel) - IA principal falhou: ${{ steps.ia.outputs.error }}"
          fi